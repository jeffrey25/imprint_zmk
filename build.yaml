# GitHub Actions build matrix for Cyboard Imprint Wireless
# Board:  assimilator-bt  (nRF52840 on the Cyboard Imprint)
# Shield: imprint_left / imprint_right
#
# To build: push to GitHub — Actions will produce:
#   imprint_left-assimilator-bt-zmk.uf2
#   imprint_right-assimilator-bt-zmk.uf2
#
---
include:
  - board: assimilator-bt
    shield: imprint_left
  - board: assimilator-bt
    shield: imprint_right
