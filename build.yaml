# GitHub Actions build matrix — Cyboard Imprint Wireless
# ZMK Studio enabled on the central (left) half only, per ZMK docs.
---
include:
  - board: assimilator-bt
    shield: imprint_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: assimilator-bt
    shield: imprint_right
