# Cyboard Imprint ZMK Configuration
# Wireless keyboard with split layout, home row mods, and 10 layers

# ==========================================
# CORE FIRMWARE SETTINGS
# ==========================================

# Device identification
CONFIG_ZMK_KEYBOARD_NAME="Imprint"
CONFIG_BT_DEVICE_NAME="Imprint"

# Wireless & USB
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y

# ==========================================
# BEHAVIOR SETTINGS
# ==========================================

# Combos (required for your R+U, G+H, etc. combos)
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=4
CONFIG_ZMK_COMBO_MAX_KEYS_PER_COMBO=3

# ==========================================
# POWER MANAGEMENT
# ==========================================

# Sleep timeout (15 minutes = 900000 ms)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Idle timeout before sleep (30 seconds = 30000 ms)
CONFIG_ZMK_IDLE_TIMEOUT=30000

# Automatically enter sleep (important for battery)
CONFIG_ZMK_SLEEP=y

# ==========================================
# WIRELESS & BLUETOOTH
# ==========================================

# Bluetooth TX power (max range)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Number of Bluetooth bonds to store (for pairing multiple devices)
CONFIG_BT_MAX_PAIRED=5

# ==========================================
# OPTIONAL: DEBUGGING
# ==========================================

# Disable USB logging (slightly faster boot)
CONFIG_ZMK_USB_LOGGING=n

# ==========================================
# NOTES
# ==========================================

# Home row mods timing is configured in your imprint.keymap:
# - Tapping term: 280ms
# - Quick tap: 175ms
# - Flavor: balanced
#
# If mods trigger accidentally:
# - Increase tapping-term-ms in imprint.keymap (try 300-320ms)
# 
# For faster mod response:
# - Decrease tapping-term-ms (try 200-250ms)
#
# Combo timeout:
# - Set to 50ms in imprint.keymap
# - Increase if combos are unreliable (try 75-100ms)
