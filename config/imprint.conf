# Cyboard Imprint Wireless — shared config (applies to both halves)
# Vial settings mapped to ZMK Kconfig equivalents

# ── Input / timing ───────────────────────────────────────────────
# Tapping term: setting 4 = 175ms
CONFIG_ZMK_BEHAVIORS_HOLD_TAP_TAPPING_TERM_MS=175

# ── Split keyboard ───────────────────────────────────────────────
CONFIG_ZMK_SPLIT=y

# ── Bluetooth ────────────────────────────────────────────────────
CONFIG_ZMK_BT=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
# Allow up to 5 BT profiles
CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=6
# Use directed advertising for faster reconnect
CONFIG_ZMK_BLE_EXPERIMENTAL_SEC=y

# ── USB ──────────────────────────────────────────────────────────
# Keep USB active alongside BT (left half acts as USB+BT central)
CONFIG_ZMK_USB=y

# ── Power management ─────────────────────────────────────────────
# Idle sleep after 15 min (900 000 ms) — matches Cyboard recommendation
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_ZMK_IDLE_TIMEOUT=30000

# ── Mouse / pointer keys ─────────────────────────────────────────
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_MOUSE_POINTER_ACCEL_NORMAL_MS=300
CONFIG_ZMK_MOUSE_POINTER_ACCEL_FAST_FACTOR=4

# ── Combos ───────────────────────────────────────────────────────
# Combo timeout is set per-combo in the keymap (50ms from Vial setting 10)

# ── LVGL / display (only if your Imprint has a display module) ───
# Uncomment if using the optional OLED:
# CONFIG_ZMK_DISPLAY=y
# CONFIG_ZMK_WIDGET_LAYER_STATUS=y
# CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
