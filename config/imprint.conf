# Cyboard Imprint Wireless — shared Kconfig
# Applies to both imprint_left and imprint_right builds.

# ── Split keyboard ────────────────────────────────────────────────
CONFIG_ZMK_SPLIT=y

# ── Bluetooth output ──────────────────────────────────────────────
# BLE is already enabled by the assimilator-bt board defconfig; set
# explicitly for clarity. (Symbol is ZMK_BLE, not ZMK_BT.)
CONFIG_ZMK_BLE=y
CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=6

# ── USB output (left half = USB + BLE central) ────────────────────
CONFIG_ZMK_USB=y

# ── Power management ──────────────────────────────────────────────
# Deep sleep after 15 min idle — matches Cyboard's default behavior.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_ZMK_IDLE_TIMEOUT=30000

# ── Mouse / pointer keys (Mouse layer uses &mkp) ──────────────────
CONFIG_ZMK_MOUSE=y

# NOTE: hold-tap tapping term (175 ms) is set per-behavior in
# imprint.keymap on the &hm behavior (tapping-term-ms = <175>),
# not via a global Kconfig symbol.
