# Cyboard Imprint ZMK Configuration
# Wireless keyboard with split layout, home row mods, and 10 layers

# ==========================================
# CORE FIRMWARE SETTINGS
# ==========================================

# Device identification
CONFIG_ZMK_KEYBOARD_NAME="Imprint"
CONFIG_BT_DEVICE_NAME="Imprint"

# Wireless & USB
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y
CONFIG_ZMK_USB_LOGGING=n

# ==========================================
# BEHAVIOR SETTINGS
# ==========================================

# Hold-tap behavior (for home row mods)
CONFIG_ZMK_BEHAVIOR_HOLD_TAP_PREFER_HOLD_EVAL_IMMEDIATE=y

# Combos (required for your R+U, G+H, etc. combos)
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=4
CONFIG_ZMK_COMBO_MAX_KEYS_PER_COMBO=3

# Macros (for M0-M5)
CONFIG_ZMK_BEHAVIOR_MACRO=y

# ==========================================
# POWER MANAGEMENT
# ==========================================

# Sleep timeout (15 minutes = 900000 ms)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Idle timeout before sleep (30 seconds = 30000 ms)
CONFIG_ZMK_IDLE_TIMEOUT=30000

# Automatically enter sleep (important for battery)
CONFIG_ZMK_SLEEP=y

# ==========================================
# SPLIT KEYBOARD SETTINGS
# ==========================================

# Enable split keyboard support
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# Optional: UART/serial support if wired connection needed
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_UART=y

# ==========================================
# WIRELESS RANGE & PERFORMANCE
# ==========================================

# Bluetooth TX power (max range)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Connection timeout (keep alive)
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n

# ==========================================
# OPTIONAL: RGB & INDICATORS
# ==========================================

# Uncomment these if your Imprint has RGB underglow/backlighting
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_ZMK_RGB_UNDERGLOW_BRT_MIN=0
# CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=100
# CONFIG_ZMK_RGB_UNDERGLOW_BRT_STEP=10
# CONFIG_ZMK_RGB_UNDERGLOW_HUE_STEP=10
# CONFIG_ZMK_RGB_UNDERGLOW_SAT_STEP=10
# CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
# CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y

# Uncomment for LED backlight (if Imprint has per-key LEDs)
# CONFIG_ZMK_BACKLIGHT=y
# CONFIG_ZMK_BACKLIGHT_BRT_MIN=0
# CONFIG_ZMK_BACKLIGHT_BRT_MAX=100
# CONFIG_ZMK_BACKLIGHT_BRT_STEP=10

# ==========================================
# OPTIONAL: DEBUGGING & LOGGING
# ==========================================

# Disable USB logging (slightly faster boot)
CONFIG_ZMK_USB_LOGGING=n

# Uncomment for debug output (helpful if troubleshooting)
# CONFIG_ZMK_LOGGING=y
# CONFIG_LOG_MODE_IMMEDIATE=y

# ==========================================
# ADVANCED TUNING
# ==========================================

# Enable key override support (if you add key overrides)
# CONFIG_ZMK_KEY_OVERRIDE=y

# Improve matrix scanning (if experiencing ghosting)
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

# ==========================================
# LAYER & FEATURE SETTINGS
# ==========================================

# Maximum number of layers (you have 10)
CONFIG_ZMK_KEYMAP_LAYER_COUNT=10

# ==========================================
# MEMORY & PERFORMANCE
# ==========================================

# Optional: Optimize flash usage
# CONFIG_ZMK_MEMORY_OPTIMIZATIONS=y

# ==========================================
# BLUETOOTH BONDING
# ==========================================

# Number of Bluetooth bonds to store (for pairing multiple devices)
CONFIG_BT_MAX_PAIRED=5

# ==========================================
# NOTES FOR YOUR IMPRINT
# ==========================================

# Home row mods timing (configured in the keymap):
# - Tapping term: 280ms
# - Quick tap: 175ms
# - Flavor: balanced
#
# If mods trigger accidentally:
# - Increase tapping-term-ms in imprint.keymap (try 300-320ms)
# - Adjust hold-trigger-key-positions if keys on unintended side register mods
#
# For faster mod response:
# - Decrease tapping-term-ms (try 200-250ms)
#
# Combo timeout:
# - Set to 50ms in imprint.keymap
# - Increase if combos are unreliable (try 75-100ms)

# ==========================================
# BATTERY MONITORING
# ==========================================

# Optional: Enable battery monitor (if Imprint reports battery)
# CONFIG_ZMK_BATTERY=y
# CONFIG_ZMK_BATTERY_POLL_MS=30000

# ==========================================
# VERSION & SANITY CHECK
# ==========================================

# This config targets ZMK main branch
# Test with: west build -b nice_nano_v2 -s app -- -DSHIELD=imprint
