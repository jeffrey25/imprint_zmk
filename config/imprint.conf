# Cyboard Imprint Wireless — shared Kconfig
# Applies to both imprint_left and imprint_right builds.

# ── Split keyboard ────────────────────────────────────────────────
CONFIG_ZMK_SPLIT=y

# ── Bluetooth ─────────────────────────────────────────────────────
CONFIG_ZMK_BT=y
CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=6

# ── USB (left half is the USB+BT central) ─────────────────────────
CONFIG_ZMK_USB=y

# ── Power management ──────────────────────────────────────────────
# Idle sleep after 15 min — matches Cyboard recommendation
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_ZMK_IDLE_TIMEOUT=30000

# ── Mouse / pointer keys ──────────────────────────────────────────
CONFIG_ZMK_MOUSE=y

# ── Hold-tap global default (overridden per-behavior in keymap) ───
CONFIG_ZMK_BEHAVIORS_HOLD_TAP_TAPPING_TERM_MS=175
